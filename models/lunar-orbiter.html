<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Orbiter — 3D model</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d24;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
  #stage{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #scene{cursor:grab;touch-action:none}
  #scene.drag{cursor:grabbing}
  #tags{position:absolute;inset:0;pointer-events:none}
  .tag{position:absolute;left:0;top:0;pointer-events:none;transition:opacity .2s}
  .dot{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
       background:#ff8a3d;box-shadow:0 0 0 2px rgba(255,138,61,.28),0 0 8px rgba(255,138,61,.6);pointer-events:auto;cursor:pointer}
  .pill{position:absolute;white-space:nowrap;font-size:12.5px;font-weight:600;line-height:1;padding:5px 8px;border-radius:6px;
        background:rgba(14,20,46,.92);border:1px solid rgba(255,255,255,.2);pointer-events:auto;cursor:pointer;
        transition:border-color .15s,background .15s}
  .tag.on .pill{border-color:#ff8a3d;background:rgba(48,28,10,.94)}
  .tag.dim{opacity:.35}
  #hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:rgba(255,255,255,.85);pointer-events:none}
  @media (max-width:480px){.pill{font-size:11px;padding:4px 6px}#hint{font-size:11px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>
  <canvas id="scene"></canvas>
  <div id="tags"></div>
</div>
<div id="hint"></div>
<script>
(() => {
const LANG = (/(^|[?&])lang=(uk|ua)\b/i.test(location.search) || (()=>{try{return localStorage.getItem('lang')==='uk'||(parent!==window&&parent.LANG==='uk')}catch(e){return false}})()) ? 'uk' : 'en';
document.documentElement.lang = LANG;
// ================= geometry =================
const V = [];          // vertices [x,y,z]
const T = [];          // triangles {i:[a,b,c], c:[r,g,b], p:part}
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const add = (a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub = (a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul = (a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; };
const vtx = p => (V.push(p), V.length-1);
let BIAS=0;
const tri = (a,b,c,col,part) => T.push({i:[a,b,c], c:hex(col), p:part, b:BIAS});
const quad = (a,b,c,d,col,part) => { tri(a,b,c,col,part); tri(a,c,d,col,part); };
const polar = (r,deg,y) => { const t=deg*Math.PI/180; return [r*Math.cos(t), y, r*Math.sin(t)]; };
function basis(a){ a=norm(a); const h = Math.abs(a[1])<.9?[0,1,0]:[1,0,0]; const u=norm(cross(a,h)); const v=cross(a,u); return [a,u,v]; }

// oriented box: center, half-extents along ex,ey,ez
function obox(c, ex, ey, ez, hx, hy, hz, col, part){
  ex=norm(ex); ey=norm(ey); ez=norm(ez);
  const P=[]; for (const sx of [-1,1]) for (const sy of [-1,1]) for (const sz of [-1,1])
    P.push(vtx(add(c, add(mul(ex,sx*hx), add(mul(ey,sy*hy), mul(ez,sz*hz))))));
  const f=[[0,1,3,2],[4,6,7,5],[0,4,5,1],[2,3,7,6],[0,2,6,4],[1,5,7,3]];
  for (const q of f) quad(P[q[0]],P[q[1]],P[q[2]],P[q[3]],col,part);
}
const box = (c,sx,sy,sz,col,part,rotDeg=0) => {
  const t=rotDeg*Math.PI/180; obox(c,[Math.cos(t),0,Math.sin(t)],[0,1,0],[-Math.sin(t),0,Math.cos(t)],sx/2,sy/2,sz/2,col,part);
};
function beam(p1,p2,w,col,part){ const d=sub(p2,p1), L=Math.hypot(...d); const [a,u,v]=basis(d);
  obox(mul(add(p1,p2),.5),a,u,v,L/2,w/2,w/2,col,part); }
// frustum along axis
function cyl(base, axis, r0, r1, h, seg, col, part, capB=true, capT=true, col2){
  const [a,u,v]=basis(axis); const top=add(base,mul(a,h)); const R0=[],R1=[];
  for(let k=0;k<seg;k++){ const t=k/seg*2*Math.PI, cu=Math.cos(t), sv=Math.sin(t);
    const off=(r)=>add(mul(u,cu*r),mul(v,sv*r));
    R0.push(vtx(add(base,off(r0)))); R1.push(vtx(add(top,off(r1)))); }
  for(let k=0;k<seg;k++){ const n=(k+1)%seg; quad(R0[k],R0[n],R1[n],R1[k],col,part); }
  if(capB && r0>0){ const c=vtx(base); for(let k=0;k<seg;k++) tri(c,R0[(k+1)%seg],R0[k],col2||col,part); }
  if(capT && r1>0){ const c=vtx(top);  for(let k=0;k<seg;k++) tri(c,R1[k],R1[(k+1)%seg],col2||col,part); }
}
function ellipsoid(c, rx, ry, rz, nu, nv, col, part){
  const G=[]; for(let j=0;j<=nv;j++){ const ph=j/nv*Math.PI; const row=[];
    for(let i=0;i<nu;i++){ const th=i/nu*2*Math.PI;
      row.push(vtx([c[0]+rx*Math.sin(ph)*Math.cos(th), c[1]+ry*Math.cos(ph), c[2]+rz*Math.sin(ph)*Math.sin(th)])); }
    G.push(row); }
  for(let j=0;j<nv;j++) for(let i=0;i<nu;i++){ const n=(i+1)%nu; quad(G[j][i],G[j][n],G[j+1][n],G[j+1][i],col,part); }
}
// ring disc subdivided (better depth sorting)
function disc(y, rIn, rOut, rings, seg, col, part){
  for(let r=0;r<rings;r++){ const a=rIn+(rOut-rIn)*r/rings, b=rIn+(rOut-rIn)*(r+1)/rings;
    for(let k=0;k<seg;k++){ const t0=k/seg*360, t1=(k+1)/seg*360;
      quad(vtx(polar(a,t0,y)),vtx(polar(b,t0,y)),vtx(polar(b,t1,y)),vtx(polar(a,t1,y)),col,part); } }
}


// ---------- build Lunar Orbiter ----------
// Equipment mounting deck (1.5 m diameter)
disc(0.07, 0.0, 0.75, 4, 32, '#9aa3ad', 'deck');
disc(0.00, 0.0, 0.75, 2, 32, '#5d646c', 'deck');
cyl([0,0,0],[0,1,0],0.75,0.75,0.07,40,'#c7a64a','deck',false,false);   // gold rim

// Solar panels (4) with 3x3 cells
for (const ang of [45,135,225,315]) {
  const t=ang*Math.PI/180, ex=[Math.cos(t),0,Math.sin(t)], ez=[-Math.sin(t),0,Math.cos(t)];
  const c=add(mul(ex,1.13),[0,0.02,0]);
  beam(add(mul(ex,0.72),[0,0.03,0]), add(mul(ex,0.8),[0,0.02,0]), 0.04,'#7d8590','panel');
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
    const cc=add(c, add(mul(ex,i*0.215), mul(ez,j*0.19)));
    const p=(sx,sz)=>vtx(add(cc, add(mul(ex,sx*0.1075), mul(ez,sz*0.095))));
    quad(p(-1,-1),p(1,-1),p(1,1),p(-1,1),'#2a2f38','panel');
  }
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
    const cc=add(c, add(mul(ex,i*0.215), add(mul(ez,j*0.19),[0,0.006,0])));
    const p=(sx,sz)=>vtx(add(cc, add(mul(ex,sx*0.095), mul(ez,sz*0.083))));
    BIAS=0.06; quad(p(-1,-1),p(1,-1),p(1,1),p(-1,1),'#1f3f9a','panel'); BIAS=0;
  }
}

// Truss: truncated cone frame
const ringY=0.97, rTop=0.44, rBase=0.6;
for (let k=0;k<8;k++){ const a=k*45+22.5;
  beam(polar(rBase,a,0.07), polar(rTop,a+22.5,ringY), 0.03, '#b9bfc7','truss');
  beam(polar(rBase,a,0.07), polar(rTop,a-22.5,ringY), 0.03, '#b9bfc7','truss'); }
// Upper structural module ring/plate
cyl([0,ringY-0.03,0],[0,1,0],rTop+0.03,rTop+0.03,0.06,32,'#d6dbe1','upper');
disc(ringY+0.03, 0.12, rTop+0.03, 2, 32, '#aeb5bd', 'upper');

// Micrometeoroid detectors (gold half-cylinders around the ring)
for (let k=0;k<14;k++){ const a=k*360/14+8; const p=polar(rTop+0.05,a,ringY+0.02);
  box(p,0.05,0.035,0.12,'#e0b84a','micro', -a); }

// Photographic subsystem (pressurised aluminised shell)
ellipsoid([0,0.45,0],0.31,0.34,0.31,30,20,'#d9dde3','photo');
cyl([0,0.07,0],[0,1,0],0.22,0.22,0.06,24,'#8f979f','photo',false,false);
// Camera lenses facing +z
cyl([-0.09,0.43,0.24],[0,0,1],0.065,0.065,0.12,20,'#1a1c21','lens',false,true,'#3d5a8a');
cyl([0.09,0.40,0.25],[0,0,1],0.048,0.048,0.11,20,'#1a1c21','lens',false,true,'#3d5a8a');
// Camera thermal door (open, tilted)
obox([0,0.62,0.33],[1,0,0],[0,0.55,0.83],[0,0.83,-0.55],0.17,0.012,0.09,'#f1ede2','door');

// Tanks (2 fuel, 2 oxidizer)
const tankY=1.15, tr=0.165;
ellipsoid([-0.18,tankY, 0.18],tr,tr,tr,24,16,'#9fa8b4','fuel');
ellipsoid([ 0.18,tankY,-0.18],tr,tr,tr,24,16,'#9fa8b4','fuel');
ellipsoid([ 0.18,tankY, 0.18],tr,tr,tr,24,16,'#c6cdd6','oxid');
ellipsoid([-0.18,tankY,-0.18],tr,tr,tr,24,16,'#c6cdd6','oxid');
// central column
cyl([0,ringY,0],[0,1,0],0.08,0.08,0.38,16,'#8a929b','upper');

// Heat shield (square plate on top)
box([0,1.37,0],0.66,0.04,0.66,'#eef0f2','shield');
// Attitude control thrusters at corners
for (const [sx,sz] of [[1,1],[1,-1],[-1,1],[-1,-1]]){
  const p=[sx*0.31,1.355,sz*0.31];
  box(p,0.06,0.05,0.06,'#6c737c','thrust');
  cyl(add(p,[sx*0.02,0,sz*0.02]),[sx,0,sz],0.012,0.03,0.06,10,'#3b3f45','thrust',false,false);
}
// Velocity control engine (nozzle pointing up)
cyl([0,1.39,0],[0,1,0],0.05,0.05,0.05,14,'#55595f','engine',false,true);
cyl([0,1.44,0],[0,1,0],0.035,0.085,0.17,20,'#3a3d42','engine',false,false);
cyl([0,1.61,0],[0,1,0],0.085,0.088,0.012,20,'#c9a64a','engine',false,false);

// Coarse sun sensor
box([0.36,1.21,0],0.06,0.05,0.06,'#2a2c31','sun');
cyl([0.39,1.21,0],[1,0,0],0.02,0.02,0.03,10,'#4a6fa5','sun',false,true);

// High-gain antenna (boom + dish) at 180°
const hgaBase=polar(0.74,180,0.05), hgaEnd=polar(1.62,180,0.42);
beam(hgaBase,hgaEnd,0.035,'#c4c9cf','hga');
box(polar(0.78,180,0.06),0.08,0.06,0.08,'#3a3e44','drive');           // antenna drive
const dishC=add(hgaEnd,[0,0.03,0]);
cyl(dishC,[0.25,1,0],0.05,0.42,0.10,32,'#e9ecef','hga',false,false);
cyl(dishC,[0.25,1,0],0.01,0.01,0.2,6,'#8b9198','hga',false,false);
ellipsoid(add(dishC,mul(norm([0.25,1,0]),0.21)),0.025,0.025,0.025,8,6,'#c9a64a','hga');

// Low-gain antenna (long boom) at 0°
const lgaBase=polar(0.74,0,0.05), lgaEnd=polar(2.15,0,0.05);
beam(lgaBase,lgaEnd,0.025,'#c4c9cf','lga');
for (const r of [1.0,1.2,1.4]) box(polar(r,0,0.05),0.04,0.05,0.05,'#8e959d','lga');
cyl(lgaEnd,[1,0,0],0.06,0.06,0.02,18,'#d8dce1','lga');
cyl(add(lgaEnd,[0.02,0,0]),[1,0,0],0.03,0.03,0.06,14,'#9aa1a9','lga');

// Equipment on deck
const D=0.07;
box(polar(0.53,62,D+0.06),0.12,0.12,0.14,'#202227','canopus',-62);
cyl(add(polar(0.53,62,D+0.08),[0,0.03,0]),[0.3,1,0.5],0.03,0.03,0.07,12,'#3d5a8a','canopus',false,true);
box(polar(0.52,118,D+0.065),0.17,0.13,0.15,'#d4aa3c','iru',-118);
box(polar(0.55,18,D+0.045),0.19,0.09,0.13,'#c3c9d0','prog',-18);
box(polar(0.54,-55,D+0.05),0.15,0.10,0.11,'#3f4650','battery',55);
box(polar(0.54,-95,D+0.05),0.15,0.10,0.11,'#3f4650','battery',95);
box(polar(0.53,-140,D+0.04),0.13,0.08,0.11,'#d4aa3c','transp',140);
box(polar(0.54,205,D+0.04),0.15,0.07,0.09,'#b9c0c8','twta',-205);
box(polar(0.55,-20,D+0.035),0.11,0.07,0.09,'#8a6d2e','mux',20);
box(polar(0.56,155,D+0.035),0.10,0.07,0.09,'#6b737d','cmd',-155);

// ---------- labels (few, pinned to parts) ----------
const L = [
 {p:['engine'],             a:[0,1.62,0],                  n:[0,1,0],  en:'Velocity control engine', uk:'Двигун корекції швидкості'},
 {p:['shield','thrust'],    a:[0.31,1.39,0.31],            n:[1,.6,1], en:'Heat shield',             uk:'Теплозахисний екран'},
 {p:['fuel','oxid'],        a:[0.3,1.15,0.25],             n:[1,0,1],  en:'Propellant tanks',        uk:'Паливні баки'},
 {p:['micro'],              a:polar(rTop+0.08,40,ringY+0.02), n:[1,0,1], en:'Micrometeoroid detectors', uk:'Детектори мікрометеоритів'},
 {p:['photo','lens','door'],a:[-0.09,0.43,0.37],           n:[0,0,1],  en:'Camera system',           uk:'Фотосистема'},
 {p:['hga','drive'],        a:add(dishC,[0,0.12,0]),       n:[-1,1,0], en:'High-gain antenna',       uk:'Гостронаправлена антена'},
 {p:['lga'],                a:polar(2.15,0,0.05),          n:[1,0,0],  en:'Low-gain antenna',        uk:'Всенаправлена антена'},
 {p:['panel'],              a:polar(1.3,315,0.04),         n:[0,1,0],  en:'Solar panels',            uk:'Сонячні панелі'},
];

// ================= rendering =================
const bg=document.getElementById('bg'), cv=document.getElementById('scene'), ctx=cv.getContext('2d');
const tagsEl=document.getElementById('tags');
document.getElementById('hint').textContent = LANG==='uk' ? 'Тягніть, щоб обертати · коліщатко або щипок — масштаб' : 'Drag to rotate · scroll or pinch to zoom';
let W=0,H=0,DPR=1;
const st={ yaw:-0.75, pitch:0.38, dist:4.5, auto:true, hover:null, pinned:null };
const LIGHT=norm([-0.45,0.65,0.62]);
const R=2.25; // model radius for auto-fit

L.forEach(l=>{ const t=document.createElement('div'); t.className='tag';
  t.innerHTML=`<div class="dot"></div><div class="pill">${l[LANG]}</div>`;
  for(const el of t.children){
    el.addEventListener('mouseenter',()=>{st.hover=l;});
    el.addEventListener('mouseleave',()=>{st.hover=null;});
    el.addEventListener('click',()=>{st.pinned = st.pinned===l?null:l;});
  }
  tagsEl.appendChild(t); l.el=t; l.pill=t.children[1]; });

function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  for(const c of [bg,cv]){ c.width=W*DPR; c.height=H*DPR; }
  ctx.setTransform(DPR,0,0,DPR,0,0); drawStars(); L.forEach(l=>l.w=null); }
function drawStars(){ const g=bg.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  const gr=g.createRadialGradient(W*0.5,H*0.45,0,W*0.5,H*0.45,Math.max(W,H)*0.8);
  gr.addColorStop(0,'#1a1a44'); gr.addColorStop(1,'#080a1c'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  let s=12345; const rnd=()=>((s=(s*16807)%2147483647)/2147483647);
  for(let i=0;i<Math.floor(W*H/3200);i++){ const r=rnd()*1.1+0.2; g.globalAlpha=0.25+rnd()*0.65;
    g.fillStyle='#fff'; g.beginPath(); g.arc(rnd()*W,rnd()*H,r,0,7); g.fill(); } g.globalAlpha=1; }

const PV=new Float32Array(V.length*3), PS=new Float32Array(V.length*2);
const CY=0.7;
function view(p,out,k){ const cy=Math.cos(st.yaw), sy=Math.sin(st.yaw), cp=Math.cos(st.pitch), sp=Math.sin(st.pitch);
  const x1=p[0]*cy+p[2]*sy, z1=-p[0]*sy+p[2]*cy, y1=p[1]-CY;
  const y2=y1*cp-z1*sp, z2=y1*sp+z1*cp; out[k]=x1; out[k+1]=y2; out[k+2]=z2; }
function rotN(n){ const cy=Math.cos(st.yaw), sy=Math.sin(st.yaw), cp=Math.cos(st.pitch), sp=Math.sin(st.pitch);
  const x1=n[0]*cy+n[2]*sy, z1=-n[0]*sy+n[2]*cy, y1=n[1]; return [x1, y1*cp-z1*sp, y1*sp+z1*cp]; }

const order=T.map((_,i)=>i), depth=new Float32Array(T.length);
let drag=false;
function frame(){
  if(st.auto && !drag && !st.hover) st.yaw += 0.003;
  const act = st.hover || st.pinned, hp = act ? act.p : null;
  const F=Math.min(W*0.44,H*0.5)*4.5/R, cx=W*0.5, cy=H*0.5;
  for(let i=0;i<V.length;i++){ view(V[i],PV,i*3); const z=st.dist-PV[i*3+2];
    PS[i*2]=cx+F*PV[i*3]/z; PS[i*2+1]=cy-F*PV[i*3+1]/z; }
  for(let t=0;t<T.length;t++){ const [a,b,c]=T[t].i; depth[t]=PV[a*3+2]+PV[b*3+2]+PV[c*3+2]+T[t].b; }
  order.sort((p,q)=>depth[p]-depth[q]);
  ctx.clearRect(0,0,W,H); ctx.lineJoin='round';
  for(const t of order){ const tr=T[t], [a,b,c]=tr.i;
    const ax=PV[a*3],ay=PV[a*3+1],az=PV[a*3+2];
    const ux=PV[b*3]-ax,uy=PV[b*3+1]-ay,uz=PV[b*3+2]-az, vx=PV[c*3]-ax,vy=PV[c*3+1]-ay,vz=PV[c*3+2]-az;
    let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx; const nl=Math.hypot(nx,ny,nz)||1; nx/=nl;ny/=nl;nz/=nl;
    const tx=-ax, ty=-ay, tz=st.dist-az; if(nx*tx+ny*ty+nz*tz<0){nx=-nx;ny=-ny;nz=-nz;}
    const dif=Math.max(0,nx*LIGHT[0]+ny*LIGHT[1]+nz*LIGHT[2]);
    const spec=Math.pow(Math.max(0,nz*0.6+ny*0.3+dif*0.4),18)*0.35;
    let [r,g,bb]=tr.c; if(hp && hp.includes(tr.p)){ r=r*0.35+255*0.65; g=g*0.35+138*0.65; bb=bb*0.35+61*0.65; }
    const k=0.34+0.78*dif;
    const col=`rgb(${Math.min(255,r*k+255*spec)|0},${Math.min(255,g*k+255*spec)|0},${Math.min(255,bb*k+255*spec)|0})`;
    ctx.fillStyle=col; ctx.strokeStyle=col; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.moveTo(PS[a*2],PS[a*2+1]); ctx.lineTo(PS[b*2],PS[b*2+1]); ctx.lineTo(PS[c*2],PS[c*2+1]); ctx.closePath();
    ctx.fill(); ctx.stroke(); }
  layoutTags(F,cx,cy,act);
  requestAnimationFrame(frame);
}

// pills sit right of their dot (left of it near the right edge); simple overlap avoidance
function layoutTags(F,cx,cy,act){
  const out=[0,0,0], placed=[];
  for(const l of L){ view(l.a,out,0); const z=st.dist-out[2];
    l.sx=cx+F*out[0]/z; l.sy=cy-F*out[1]/z; l.z=out[2];
    l.vis = rotN(norm(l.n))[2] > -0.2;
    if(l.w==null){ l.w=l.pill.offsetWidth; l.h=l.pill.offsetHeight; } }
  const arr=[...L].sort((a,b)=>a.sy-b.sy);
  for(const l of arr){
    let px = l.sx+9; if(px+l.w > W-6) px = l.sx-9-l.w; px=Math.max(6,px);
    let py = l.sy-l.h/2-4;
    for(let guard=0;guard<12;guard++){ let hit=null;
      for(const p of placed) if(px<p.x+p.w+4 && px+l.w+4>p.x && py<p.y+p.h+3 && py+l.h+3>p.y){ hit=p; break; }
      if(!hit) break; py = hit.y+hit.h+3; }
    py=Math.max(4,Math.min(H-l.h-30,py));
    placed.push({x:px,y:py,w:l.w,h:l.h});
    l.el.style.transform='translate(0,0)';
    l.el.firstChild.style.left=l.sx+'px'; l.el.firstChild.style.top=l.sy+'px';
    l.pill.style.left=px+'px'; l.pill.style.top=py+'px';
    l.el.classList.toggle('on', act===l);
    l.el.classList.toggle('dim', !l.vis && act!==l);
    l.el.style.zIndex = act===l ? 50 : (l.vis?10:1);
  }
}

// ================= interaction =================
let lx=0, ly=0, pinch=null;
cv.addEventListener('pointerdown',e=>{ drag=true; lx=e.clientX; ly=e.clientY; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!drag||pinch) return; st.yaw+=(e.clientX-lx)*0.008; st.pitch=Math.max(-1.3,Math.min(1.45,st.pitch+(e.clientY-ly)*0.006)); lx=e.clientX; ly=e.clientY; });
const end=()=>{ drag=false; cv.classList.remove('drag'); };
cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
cv.addEventListener('dblclick',()=>{ st.auto=!st.auto; });
cv.addEventListener('wheel',e=>{ e.preventDefault(); st.dist=Math.max(2.8,Math.min(10,st.dist*(1+Math.sign(e.deltaY)*0.08))); },{passive:false});
cv.addEventListener('touchstart',e=>{ if(e.touches.length===2){ pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); }},{passive:true});
cv.addEventListener('touchmove',e=>{ if(e.touches.length===2&&pinch){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  st.dist=Math.max(2.8,Math.min(10,st.dist*pinch/d)); pinch=d; }},{passive:true});
cv.addEventListener('touchend',e=>{ if(e.touches.length<2) pinch=null; },{passive:true});
addEventListener('resize',resize);

resize(); requestAnimationFrame(frame);
})();
</script>
